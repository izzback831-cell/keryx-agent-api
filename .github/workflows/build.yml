name: Windows and Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Test and build MCP relay
        working-directory: relay
        run: |
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          go build -mod=readonly -trimpath .
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Test and build wallet helper
        working-directory: agent
        run: |
          cargo +1.96.0 test --locked
          cargo +1.96.0 build --locked --release
